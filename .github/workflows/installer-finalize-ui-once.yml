name: Installer finalize UI once

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-finalize-ui-once.yml

permissions:
  contents: write

jobs:
  patch-test-and-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Apply finalization UI
        run: python3 .github/installer-finalize-ui.once.py
      - name: Format finalization UI
        run: npx vp check --fix resources/js/pages/install/index.tsx
      - name: Verify frontend
        shell: bash
        run: |
          npm run check
          npm run typecheck
      - name: Commit verified UI and remove temporary files
        shell: bash
        run: |
          git rm .github/workflows/installer-finalize-ui-once.yml
          git rm .github/installer-finalize-ui.once.py
          git add resources/js/pages/install/index.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add installer finalization UI'
          git push origin HEAD:feature/self-host-installer

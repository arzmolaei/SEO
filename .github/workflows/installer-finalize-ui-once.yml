name: Installer finalize UI once

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-finalize-ui-once.yml

permissions:
  contents: write

jobs:
  patch-test-and-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare application environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force --ansi
      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form
      - name: Apply finalization UI
        run: python3 .github/installer-finalize-ui.once.py
      - name: Format finalization UI
        run: npx vp check --fix resources/js/pages/install/index.tsx
      - name: Verify frontend
        shell: bash
        run: |
          npm run check
          npm run types:check
      - name: Commit verified UI and remove temporary files
        shell: bash
        run: |
          git rm .github/workflows/installer-finalize-ui-once.yml
          git rm .github/installer-finalize-ui.once.py
          git add resources/js/pages/install/index.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add installer finalization UI'
          git push origin HEAD:feature/self-host-installer

name: Bootstrap Foundation

on:
  push:
    branches:
      - feature/foundation-keyword-core

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[skip bootstrap]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop when scaffold already exists
        id: scaffold
        shell: bash
        run: |
          if [ -f artisan ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.scaffold.outputs.needed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        if: steps.scaffold.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pinned official Laravel React starter
        if: steps.scaffold.outputs.needed == 'true'
        shell: bash
        env:
          STARTER_SHA: 717b8f55aefd82d25d4119eaebdc8e3a72b8d7e5
        run: |
          git clone --no-tags https://github.com/laravel/react-starter-kit.git /tmp/seo-os
          git -C /tmp/seo-os checkout --detach "$STARTER_SHA"
          test "$(git -C /tmp/seo-os rev-parse HEAD)" = "$STARTER_SHA"

      - name: Install backend dependencies
        if: steps.scaffold.outputs.needed == 'true'
        working-directory: /tmp/seo-os
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify framework contract
        if: steps.scaffold.outputs.needed == 'true'
        working-directory: /tmp/seo-os
        shell: bash
        run: |
          php -r '
          $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
          $versions = [];
          foreach ($lock["packages"] as $package) { $versions[$package["name"]] = $package["version"]; }
          foreach (["laravel/framework" => "v13.", "inertiajs/inertia-laravel" => "v3."] as $name => $prefix) {
              $version = $versions[$name] ?? "missing";
              if (!str_starts_with($version, $prefix)) {
                  fwrite(STDERR, "$name must start with $prefix, got $version\n");
                  exit(1);
              }
              echo "$name=$version\n";
          }
          '

      - name: Prepare application environment
        if: steps.scaffold.outputs.needed == 'true'
        working-directory: /tmp/seo-os
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force --ansi

      - name: Install frontend dependencies
        if: steps.scaffold.outputs.needed == 'true'
        working-directory: /tmp/seo-os
        run: npm ci

      - name: Verify frontend types
        if: steps.scaffold.outputs.needed == 'true'
        working-directory: /tmp/seo-os
        run: npm run types:check

      - name: Verify production build
        if: steps.scaffold.outputs.needed == 'true'
        working-directory: /tmp/seo-os
        run: npm run build

      - name: Verify backend tests
        if: steps.scaffold.outputs.needed == 'true'
        working-directory: /tmp/seo-os
        run: php artisan test

      - name: Record dependency audit summary
        if: steps.scaffold.outputs.needed == 'true'
        working-directory: /tmp/seo-os
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit-runtime.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit-runtime.json', 'utf8'));
          const v = report.metadata?.vulnerabilities ?? {};
          console.log(`runtime-audit total=${v.total ?? 0} low=${v.low ?? 0} moderate=${v.moderate ?? 0} high=${v.high ?? 0} critical=${v.critical ?? 0}`);
          NODE

      - name: Copy verified scaffold into repository
        if: steps.scaffold.outputs.needed == 'true'
        shell: bash
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='database/database.sqlite' \
            --exclude='public/build' \
            /tmp/seo-os/ ./
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.scripts.typecheck = p.scripts['types:check'] || 'tsc --noEmit';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 4) + '\n');
          NODE
          cat > README.md <<'EOF'
          # SEO OS

          A self-hostable SEO operations workspace for freelancers and small SEO teams.

          Product architecture and implementation plans live in `docs/superpowers/`.
          EOF

      - name: Commit verified scaffold
        if: steps.scaffold.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "seo-os-bootstrap[bot]"
          git config user.email "seo-os-bootstrap@users.noreply.github.com"
          git add -A
          git commit -m "chore: scaffold Laravel 13 React foundation [skip bootstrap]"
          git fetch origin feature/foundation-keyword-core
          git rebase origin/feature/foundation-keyword-core
          git push origin HEAD:feature/foundation-keyword-core

name: Installer UI formatter diff

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-ui-diagnostic.yml

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Capture formatter diff
        shell: bash
        run: |
          npx vp fmt resources/js/pages/install/index.tsx --write
          git diff -- resources/js/pages/install/index.tsx > format.diff
      - uses: actions/upload-artifact@v5
        with:
          name: installer-ui-format-diff
          path: format.diff
          if-no-files-found: error

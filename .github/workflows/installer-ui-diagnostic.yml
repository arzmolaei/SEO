name: Installer UI formatter apply

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-ui-diagnostic.yml

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/self-host-installer
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Format installer page
        run: npx vp fmt resources/js/pages/install/index.tsx --write
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- resources/js/pages/install/index.tsx; then
            echo "Installer page already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/install/index.tsx
          git commit -m "style: format installer environment UI"
          git push origin HEAD:feature/self-host-installer

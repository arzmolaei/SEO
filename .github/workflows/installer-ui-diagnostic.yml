name: Installer UI diagnostic

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-ui-diagnostic.yml

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Format installer page
        run: npx vp fmt resources/js/pages/install/index.tsx --write
      - name: Capture frontend verification
        shell: bash
        run: |
          set +e
          npm run check > check.txt 2>&1
          echo "check_exit=$?" >> check.txt
          npm run types:check > types.txt 2>&1
          echo "types_exit=$?" >> types.txt
          npm run build > build.txt 2>&1
          echo "build_exit=$?" >> build.txt
          exit 0
      - uses: actions/upload-artifact@v5
        with:
          name: installer-ui-diagnostics
          path: |
            resources/js/pages/install/index.tsx
            check.txt
            types.txt
            build.txt
          if-no-files-found: error

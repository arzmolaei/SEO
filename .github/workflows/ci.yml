name: CI

on:
  push:
    branches:
      - 'feature/keyword-intelligence'

permissions:
  contents: write

jobs:
  format-keyword-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: timeout 180s npm ci --prefer-offline --no-audit

      - name: Apply project frontend formatter
        shell: bash
        run: |
          ./node_modules/.bin/vp check --fix
          git diff --check
          git checkout HEAD^ -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml resources/js/components/keyword-intelligence resources/js/pages/projects/keywords.tsx
          if git diff --cached --quiet; then
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format keyword intelligence workspace"
          git push origin "HEAD:${GITHUB_REF_NAME}"

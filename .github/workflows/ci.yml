name: CI

on:
  push:
    branches:
      - 'feature/keyword-intelligence'

permissions:
  contents: write

jobs:
  patch-manual-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Wayfinder environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan wayfinder:generate --with-form

      - name: Patch, format, and type-check manual editor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('resources/js/components/keyword-intelligence/cluster-manual-editor.tsx')
          text = path.read_text()

          text = replace_once(text, "    const [mergeSearching, setMergeSearching] = useState(false);\n", "    const [mergeSearching, setMergeSearching] = useState(false);\n    const [mergeSearched, setMergeSearched] = useState(false);\n", 'merge searched state')
          text = replace_once(text, "    const [memberSearching, setMemberSearching] = useState(false);\n", "    const [memberSearching, setMemberSearching] = useState(false);\n    const [memberSearched, setMemberSearched] = useState(false);\n", 'member searched state')
          text = replace_once(text, "    const [targetSearching, setTargetSearching] = useState(false);\n", "    const [targetSearching, setTargetSearching] = useState(false);\n    const [targetSearched, setTargetSearched] = useState(false);\n", 'target searched state')
          text = replace_once(text, "        setSearching: (value: boolean) => void,\n    ) => {\n        setSearching(true);\n", "        setSearching: (value: boolean) => void,\n        setSearched: (value: boolean) => void,\n    ) => {\n        setSearching(true);\n        setSearched(true);\n", 'cluster search signature')
          text = replace_once(text, "    const searchMembers = async () => {\n        setMemberSearching(true);\n", "    const searchMembers = async () => {\n        setMemberSearching(true);\n        setMemberSearched(true);\n", 'member search state')

          text = text.replace("                                        setMergeSearching,\n                                    );", "                                        setMergeSearching,\n                                        setMergeSearched,\n                                    );")
          text = text.replace("                                    setMergeSearching,\n                                )", "                                    setMergeSearching,\n                                    setMergeSearched,\n                                )")
          text = text.replace("                                        setTargetSearching,\n                                    );", "                                        setTargetSearching,\n                                        setTargetSearched,\n                                    );")
          text = text.replace("                                    setTargetSearching,\n                                )", "                                    setTargetSearching,\n                                    setTargetSearched,\n                                )")

          text = replace_once(text, "                    {mergeResults.length > 0 && (\n                        <div className=\"mt-2 max-h-40 overflow-auto rounded-md border p-1\">", "                    {mergeSearched &&\n                        !mergeSearching &&\n                        mergeResults.length === 0 && (\n                            <p className=\"mt-2 text-xs text-muted-foreground\">\n                                {copy.noResults}\n                            </p>\n                        )}\n                    {mergeResults.length > 0 && (\n                        <div className=\"mt-2 max-h-40 overflow-auto rounded-md border p-1\">", 'merge empty state')
          text = replace_once(text, "                    {memberResults.length > 0 && (\n                        <div className=\"mt-2 max-h-40 overflow-auto rounded-md border p-1\">", "                    {memberSearched &&\n                        !memberSearching &&\n                        memberResults.length === 0 && (\n                            <p className=\"mt-2 text-xs text-muted-foreground\">\n                                {copy.noResults}\n                            </p>\n                        )}\n                    {memberResults.length > 0 && (\n                        <div className=\"mt-2 max-h-40 overflow-auto rounded-md border p-1\">", 'member empty state')
          text = replace_once(text, "                    {targetResults.length > 0 && (\n                        <div className=\"mt-2 max-h-36 overflow-auto rounded-md border p-1\">", "                    {targetSearched &&\n                        !targetSearching &&\n                        targetResults.length === 0 && (\n                            <p className=\"mt-2 text-xs text-muted-foreground\">\n                                {copy.noResults}\n                            </p>\n                        )}\n                    {targetResults.length > 0 && (\n                        <div className=\"mt-2 max-h-36 overflow-auto rounded-md border p-1\">", 'target empty state')
          text = replace_once(text, "            if (splitPrimaryId === member.keyword_id) setSplitPrimaryId(null);\n            return;\n        }\n        setSplitMembers((current) => [...current, member]);", "            if (splitPrimaryId === member.keyword_id) setSplitPrimaryId(null);\n            if (member.is_primary) setSplitReplacement(null);\n            return;\n        }\n        if (splitReplacement?.keyword_id === member.keyword_id) {\n            setSplitReplacement(null);\n        }\n        setSplitMembers((current) => [...current, member]);", 'split replacement consistency')

          path.write_text(text)
          PY

          npm ci --prefer-offline --no-audit
          ./node_modules/.bin/vp check --fix
          npm run types:check
          git diff --check
          git checkout HEAD^ -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml resources/js/components/keyword-intelligence/cluster-manual-editor.tsx
          if git diff --cached --quiet; then
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden manual cluster editor states"
          git push origin "HEAD:${GITHUB_REF_NAME}"

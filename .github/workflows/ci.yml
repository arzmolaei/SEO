name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force --ansi

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form

      - name: Diagnose project shell formatting
        shell: bash
        run: |
          npm run check -- --fix || true
          git diff -- resources/js/components/project-workspace-shell.tsx
          git checkout -- .

      - name: Check frontend
        run: npm run check

      - name: Check TypeScript
        run: npm run types:check

      - name: Build production assets
        run: npm run build

      - name: Check PHP style
        run: composer lint:check

      - name: Static analysis
        run: composer types:check

      - name: Run backend tests
        run: php artisan test

      - name: Audit runtime npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit runtime Composer dependencies
        run: composer audit --no-dev

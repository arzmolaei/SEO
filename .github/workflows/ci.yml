name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Diagnose intent PHP style
        shell: bash
        run: |
          vendor/bin/pint app/Domain/Keywords/IntentRule.php app/Domain/Keywords/KeywordIntentClassification.php
          git diff -- app/Domain/Keywords/IntentRule.php app/Domain/Keywords/KeywordIntentClassification.php
          exit 1

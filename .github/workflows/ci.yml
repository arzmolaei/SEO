name: PHP Format Diagnostic

on:
  push:
    branches:
      - 'diagnostic/font-format-20261022'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Capture Pint diff
        run: |
          ./vendor/bin/pint app/Domain/Keywords/SavedKeywordViewState.php scripts/fonts/install-private-fonts.php
          git diff -- app/Domain/Keywords/SavedKeywordViewState.php scripts/fonts/install-private-fonts.php
          exit 1

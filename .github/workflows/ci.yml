name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Refresh Composer lock metadata
        shell: bash
        run: |
          composer update --lock --no-install --no-scripts --no-interaction --no-progress
          if git diff --quiet -- composer.lock; then
            echo "Composer lock metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "build: sync Composer lock metadata"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force --ansi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: timeout 180s npm ci --prefer-offline --no-audit

      - name: Bundle open-source fonts
        run: bash scripts/fonts/fetch-vazirmatn.sh

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form

      - name: Check frontend
        run: npm run check

      - name: Check TypeScript
        run: npm run types:check

      - name: Build production assets
        run: npm run build

      - name: Check PHP style
        run: composer lint:check

      - name: Static analysis
        run: composer types:check

      - name: Run backend tests
        run: php artisan test

      - name: Audit runtime npm dependencies
        run: timeout 120s npm audit --omit=dev --audit-level=high

      - name: Audit runtime Composer dependencies
        run: timeout 120s composer audit --no-dev

  php-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare compatibility environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force --ansi

      - name: Run backend compatibility suite
        run: php artisan test

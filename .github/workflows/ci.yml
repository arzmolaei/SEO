name: CI

on:
  push:
    branches:
      - 'feature/keyword-intelligence'

permissions:
  contents: write

jobs:
  replace-project-id:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Replace inferred project id
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('resources/js/pages/projects/keywords.tsx')
          text = path.read_text()
          old = "    const projectId = Number(path.split('/')[2]);\n"
          new = "    const projectId = intelligence.project_id;\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one project id inference, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

          git checkout HEAD^ -- .github/workflows/ci.yml
          git diff --check
          git add .github/workflows/ci.yml resources/js/pages/projects/keywords.tsx
          if git diff --cached --quiet; then
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: use explicit intelligence project identity"
          git push origin "HEAD:${GITHUB_REF_NAME}"

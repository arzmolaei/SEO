name: CI

on:
  push:
    branches:
      - 'feature/keyword-intelligence'

permissions:
  contents: write

jobs:
  patch-review-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Patch and format review UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          review_path = Path('resources/js/pages/projects/review-queue.tsx')
          review = review_path.read_text()
          review = replace_once(
              review,
              "    type: 'intent' | 'cluster';",
              "    type: 'intent' | 'cluster' | 'mapping_conflict';",
              'review type union',
          )
          review = replace_once(
              review,
              "                                            {item.type === 'cluster'\n                                                ? `${t('review.cluster')}: `\n                                                : ''}\n",
              "                                            {item.type === 'cluster'\n                                                ? `${t('review.cluster')}: `\n                                                : item.type ===\n                                                    'mapping_conflict'\n                                                  ? `${t('review.mappingConflict')}: `\n                                                  : ''}\n",
              'review heading label',
          )
          review_path.write_text(review)

          i18n_path = Path('resources/js/i18n/index.ts')
          i18n = i18n_path.read_text()
          i18n = replace_once(
              i18n,
              "        'review.cluster': 'پیشنهاد خوشه',\n",
              "        'review.cluster': 'پیشنهاد خوشه',\n        'review.mappingConflict': 'تعارض نگاشت',\n",
              'fa mapping label',
          )
          i18n = replace_once(
              i18n,
              "        'review.cluster': 'Cluster suggestion',\n",
              "        'review.cluster': 'Cluster suggestion',\n        'review.mappingConflict': 'Mapping conflict',\n",
              'en mapping label',
          )
          i18n = replace_once(
              i18n,
              "        'review.description':\n            'نیت جستجو را با دلیل بررسی کنید؛ تصمیم شما بر پیشنهادهای خودکار اولویت دارد.',\n",
              "        'review.description':\n            'نیت جستجو، پیشنهاد خوشه و هشدار نگاشت را با دلیل بررسی کنید؛ تصمیم شما بر پیشنهادهای خودکار اولویت دارد.',\n",
              'fa review description',
          )
          i18n = replace_once(
              i18n,
              "        'review.description':\n            'Review search intent with evidence. Your decisions take precedence over automatic suggestions.',\n",
              "        'review.description':\n            'Review search intent, cluster suggestions, and mapping warnings with evidence. Your decisions take precedence over automatic suggestions.',\n",
              'en review description',
          )
          i18n = replace_once(
              i18n,
              "        'review.refresh': 'آماده\\u200cسازی پیشنهادها',\n",
              "        'review.refresh': 'آماده\\u200cسازی پیشنهادهای نیت',\n",
              'fa refresh label',
          )
          i18n = replace_once(
              i18n,
              "        'review.refresh': 'Prepare suggestions',\n",
              "        'review.refresh': 'Prepare intent suggestions',\n",
              'en refresh label',
          )
          i18n_path.write_text(i18n)
          PY

          npm ci --prefer-offline --no-audit
          ./node_modules/.bin/vp check --fix
          git diff --check
          git checkout HEAD^ -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml resources/js/pages/projects/review-queue.tsx resources/js/i18n/index.ts
          if git diff --cached --quiet; then
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: label mapping conflicts in review queue"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force --ansi

      - name: Install frontend dependencies
        run: timeout 180s npm ci --prefer-offline --no-audit

      - name: Bundle open-source fonts
        run: bash scripts/fonts/fetch-vazirmatn.sh

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form

      - name: Check frontend
        run: npm run check

      - name: Check TypeScript
        run: npm run types:check

      - name: Build production assets
        run: npm run build

      - name: Check PHP style
        run: composer lint:check

      - name: Static analysis
        run: composer types:check

      - name: Run backend tests
        run: php artisan test

      - name: Audit runtime npm dependencies
        run: timeout 120s npm audit --omit=dev --audit-level=high

      - name: Audit runtime Composer dependencies
        run: timeout 120s composer audit --no-dev

      - name: Install runtime-only Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - name: Build and smoke-test production release tree
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ROOT="$RUNNER_TEMP/seo-os-release"
          RELEASE_LOG="$RUNNER_TEMP/seo-os-release-server.log"
          RELEASE_HTML="$RUNNER_TEMP/seo-os-release-install.html"
          php scripts/release/build-release.php "$RELEASE_ROOT"
          test ! -e "$RELEASE_ROOT/vendor/phpunit/phpunit"
          test ! -e "$RELEASE_ROOT/vendor/phpstan/phpstan"
          test ! -e "$RELEASE_ROOT/.env"
          test ! -e "$RELEASE_ROOT/node_modules"
          test ! -e "$RELEASE_ROOT/tests"
          test -f "$RELEASE_ROOT/VERSION"
          test -f "$RELEASE_ROOT/public/build/manifest.json"
          test -f "$RELEASE_ROOT/app/Http/Controllers/InstallerController.php"
          test -f "$RELEASE_ROOT/app/Http/Controllers/Settings/SystemBackupController.php"
          test -f "$RELEASE_ROOT/app/Http/Controllers/Settings/SystemRestoreController.php"
          test -f "$RELEASE_ROOT/app/Services/Backup/CreateSystemBackup.php"
          test -f "$RELEASE_ROOT/app/Services/Backup/RestoreSystemBackup.php"
          test -f "$RELEASE_ROOT/app/Services/Backup/RecoverInterruptedRestore.php"
          test -f "$RELEASE_ROOT/app/Support/Lifecycle/LifecycleMutex.php"
          test -f "$RELEASE_ROOT/config/backup.php"
          test -f "$RELEASE_ROOT/routes/settings.php"
          grep -q 'backup-restore' "$RELEASE_ROOT/public/build/manifest.json"
          (
            cd "$RELEASE_ROOT"
            php artisan --version
            INSTALLER_ASSUME_INSTALLED=false APP_ENV=production \
              php -S 127.0.0.1:8765 -t public public/index.php >"$RELEASE_LOG" 2>&1 &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
            READY=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8765/install -o "$RELEASE_HTML"; then
                READY=1
                break
              fi
              sleep 0.25
            done
            if [ "$READY" -ne 1 ]; then
              cat "$RELEASE_LOG"
              exit 1
            fi
            grep -q 'id="app"' "$RELEASE_HTML"
            kill "$SERVER_PID"
            wait "$SERVER_PID" || true
            trap - EXIT
          )

  php-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare compatibility environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force --ansi

      - name: Run backend compatibility suite
        run: php artisan test

  self-host-installer-mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-secret
          MARIADB_DATABASE: seo_os_installer
          MARIADB_USER: seo_os
          MARIADB_PASSWORD: installer-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SELF_HOST_INSTALLER_CONNECTED: '1'
      INSTALLER_CONNECTED_DB_HOST: 127.0.0.1
      INSTALLER_CONNECTED_DB_PORT: '3306'
      INSTALLER_CONNECTED_DB_DATABASE: seo_os_installer
      INSTALLER_CONNECTED_DB_USERNAME: seo_os
      INSTALLER_CONNECTED_DB_PASSWORD: installer-secret
      INSTALLER_ASSUME_INSTALLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application key
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run connected self-host installer acceptance
        run: php artisan test tests/Feature/System/SelfHostInstallerAcceptanceTest.php --fail-on-skipped

  persian-export-mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-secret
          MARIADB_DATABASE: seo_os_export
          MARIADB_USER: seo_export
          MARIADB_PASSWORD: export-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PERSIAN_EXPORT_CONNECTED: '1'
      PERSIAN_EXPORT_LARGE: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: seo_os_export
      DB_USERNAME: seo_export
      DB_PASSWORD: export-secret
      INSTALLER_ASSUME_INSTALLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare connected export database
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan migrate:fresh --force --ansi

      - name: Run connected and large Persian export acceptance
        run: >-
          php artisan test
          tests/Feature/Exports/ProjectSeoExportLargeDatasetTest.php
          tests/Feature/Acceptance/PersianExportMariaDbAcceptanceTest.php
          --fail-on-skipped

  backup-restore-mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      source-db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: source-root-secret
          MARIADB_DATABASE: seo_backup_source
          MARIADB_USER: seo_backup_source
          MARIADB_PASSWORD: source-db-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      destination-db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: destination-root-secret
          MARIADB_DATABASE: seo_backup_destination
          MARIADB_USER: seo_backup_destination
          MARIADB_PASSWORD: destination-db-secret
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      BACKUP_RESTORE_CONNECTED: '1'
      BACKUP_SOURCE_DB_HOST: 127.0.0.1
      BACKUP_SOURCE_DB_PORT: '3306'
      BACKUP_SOURCE_DB_DATABASE: seo_backup_source
      BACKUP_SOURCE_DB_USERNAME: seo_backup_source
      BACKUP_SOURCE_DB_PASSWORD: source-db-secret
      BACKUP_DESTINATION_DB_HOST: 127.0.0.1
      BACKUP_DESTINATION_DB_PORT: '3307'
      BACKUP_DESTINATION_DB_DATABASE: seo_backup_destination
      BACKUP_DESTINATION_DB_USERNAME: seo_backup_destination
      BACKUP_DESTINATION_DB_PASSWORD: destination-db-secret
      INSTALLER_ASSUME_INSTALLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application key
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run connected backup restore acceptance
        run: php artisan test tests/Feature/Acceptance/BackupRestoreMariaDbAcceptanceTest.php --fail-on-skipped

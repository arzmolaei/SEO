name: tmp-fmt-diagnose
on:
  push:
    branches:
      - 'feature/tmp-fmt-a'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: timeout 180s npm ci --prefer-offline --no-audit
      - name: Format new docs and report the diff as annotations
        shell: bash
        run: |
          set +e
          npx vp fmt docs/release-readiness/update-recovery-rollback.md docs/update-recovery-operations.md > /tmp/fmt.out 2>&1
          echo "fmt exit=$?" >> /tmp/fmt.out
          git diff --stat > /tmp/diff.txt
          git diff >> /tmp/diff.txt
          {
            echo "=== fmt output ==="; head -c 3000 /tmp/fmt.out
            echo "=== git diff ==="; head -c 50000 /tmp/diff.txt
          } > /tmp/report.txt
          MSG=$(python3 - <<'PY'
          import urllib.parse
          t=open('/tmp/report.txt',encoding='utf-8',errors='replace').read()
          print(t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
          )
          echo "::error title=fmt-report::$MSG"

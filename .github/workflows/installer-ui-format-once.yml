name: Installer UI format once

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-ui-format-once.yml

permissions:
  contents: write

jobs:
  format-and-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Apply formatter and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx vp check --fix resources/js/pages/install/index.tsx
          git rm .github/workflows/installer-ui-format-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/install/index.tsx
          git commit -m "style: format installer migration UI"
          git push origin HEAD:feature/self-host-installer

name: Format installer diagnostic

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/format-installer-diagnostic.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Format installer page
        run: npx vp fmt resources/js/pages/install/index.tsx --write
      - name: Upload formatted installer page
        uses: actions/upload-artifact@v5
        with:
          name: formatted-installer-page
          path: resources/js/pages/install/index.tsx
          if-no-files-found: error

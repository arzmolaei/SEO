name: Installer finalize HTTP once

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-finalize-http-once.yml

permissions:
  contents: write

jobs:
  wire-test-and-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare test application
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force --ansi
      - name: Apply finalization HTTP wiring
        run: python3 .github/installer-finalize-http.once.py
      - name: Format changed PHP
        run: vendor/bin/pint app/Actions/Installer/FinalizeInstallation.php app/Http/Controllers/InstallerController.php app/Http/Middleware/EnsureApplicationInstalled.php app/Support/InstallationState.php app/Support/Installer/CreateInitialOwner.php app/Support/RuntimeApplicationKey.php config/installer.php routes/web.php
      - name: Run focused installer finalization tests
        run: php artisan test tests/Feature/System/InstallerOwnerTest.php tests/Feature/System/InstallerFinalizationTest.php
      - name: Commit verified wiring and remove temporary files
        shell: bash
        run: |
          git rm .github/workflows/installer-finalize-http-once.yml
          git rm .github/installer-finalize-http.once.py
          git add app/Actions/Installer/FinalizeInstallation.php app/Http/Controllers/InstallerController.php app/Http/Middleware/EnsureApplicationInstalled.php app/Support/InstallationState.php app/Support/Installer/CreateInitialOwner.php app/Support/RuntimeApplicationKey.php config/installer.php routes/web.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: finalize self-host installation safely'
          git push origin HEAD:feature/self-host-installer

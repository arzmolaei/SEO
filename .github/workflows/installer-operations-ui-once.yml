name: Installer operations UI once

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-operations-ui-once.yml

permissions:
  contents: write

jobs:
  patch-format-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Apply operations UI and clean temporary files
        shell: bash
        run: |
          python3 scripts/ci/apply-installer-operations-ui.py
          npx vp check --fix resources/js/pages/install/index.tsx
          git rm .github/workflows/installer-operations-ui-once.yml scripts/ci/apply-installer-operations-ui.py
          git add resources/js/pages/install/index.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add installer operations UI'
          git push origin HEAD:feature/self-host-installer

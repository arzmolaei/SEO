name: Installer operations UI once

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-operations-ui-once.yml

permissions:
  contents: write

jobs:
  patch-and-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Apply operations UI and remove temporary files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('resources/js/pages/install/index.tsx')
          source = path.read_text()
          card = Path('.github/installer-operations-card.once.txt').read_text().rstrip()

          migration = "type MigrationState = {\n    pending_count: number | null;\n    pending: string[];\n    complete: boolean;\n    available: boolean;\n};"
          operation_types = "type OperationalState = 'verified' | 'warning' | 'fail';\n\ntype OperationsState = {\n    scheduler: {\n        state: OperationalState;\n        observed_at: string | null;\n    };\n    queue: {\n        state: OperationalState;\n        completed_at: string | null;\n    };\n    instructions: {\n        scheduler: string;\n        worker: string;\n    };\n    blocking: boolean;\n};"
          if migration not in source:
              raise SystemExit('migration type anchor missing')
          source = source.replace(migration, migration + '\n\n' + operation_types, 1)

          export_anchor = '\nexport default function Installer({'
          if export_anchor not in source:
              raise SystemExit('export anchor missing')
          source = source.replace(export_anchor, '\n' + card + '\n' + export_anchor, 1)

          props_head = "    migrations,\n}: {"
          if props_head not in source:
              raise SystemExit('props head anchor missing')
          source = source.replace(props_head, "    migrations,\n    operations,\n}: {", 1)

          props_tail = "    migrations: MigrationState | null;\n}) {"
          if props_tail not in source:
              raise SystemExit('props tail anchor missing')
          source = source.replace(props_tail, "    migrations: MigrationState | null;\n    operations: OperationsState | null;\n}) {", 1)

          owner_action = "    const canCreateOwner = installer.actions.includes('create_owner');\n"
          if owner_action not in source:
              raise SystemExit('owner action anchor missing')
          source = source.replace(
              owner_action,
              owner_action
              + "    const canDispatchQueueProbe = installer.actions.includes(\n"
              + "        'dispatch_queue_probe',\n"
              + "    );\n"
              + "    const canContinueOperations = installer.actions.includes(\n"
              + "        'continue_operations',\n"
              + "    );\n",
              1,
          )

          placeholder_start = "                    {['operations', 'finalize'].includes(installer.phase) ? ("
          start = source.find(placeholder_start)
          if start < 0:
              raise SystemExit('operations placeholder start missing')
          end_marker = "                    ) : null}"
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('operations placeholder end missing')
          end += len(end_marker)

          replacement = "\n".join([
              "                    {installer.phase === 'operations' && operations ? (",
              "                        <OperationsCard",
              "                            operations={operations}",
              "                            canDispatchProbe={canDispatchQueueProbe}",
              "                            canContinue={canContinueOperations}",
              "                        />",
              "                    ) : null}",
              "",
              "                    {installer.phase === 'finalize' ? (",
              "                        <section className=\"rounded-2xl border border-dashed bg-card/50 p-5 sm:p-6\">",
              "                            <h2 className=\"font-semibold\">",
              "                                مرحله نهایی‌سازی آماده‌ی پیاده‌سازی است",
              "                            </h2>",
              "                            <p className=\"mt-1 text-sm leading-6 text-muted-foreground\">",
              "                                این مرحله فقط بعد از تکمیل قرارداد نهایی‌سازی",
              "                                فعال می‌شود؛ تا آن زمان هیچ دکمه‌ی عبور ساختگی",
              "                                نمایش داده نمی‌شود.",
              "                            </p>",
              "                        </section>",
              "                    ) : null}",
          ])
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          PY
          npx vp check --fix resources/js/pages/install/index.tsx
          git rm .github/workflows/installer-operations-ui-once.yml
          git rm .github/installer-operations-card.once.txt
          git add resources/js/pages/install/index.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add installer operational activation UI'
          git push origin HEAD:feature/self-host-installer

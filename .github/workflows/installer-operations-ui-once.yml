name: Installer operations UI once

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-operations-ui-once.yml

permissions:
  contents: write

jobs:
  patch-and-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Apply operations UI and remove temporary workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('resources/js/pages/install/index.tsx')
          source = path.read_text()

          type_anchor = """type MigrationState = {
              pending_count: number | null;
              pending: string[];
              complete: boolean;
              available: boolean;
          };
          """
          type_replacement = type_anchor + """
          type OperationalState = 'verified' | 'warning' | 'fail';

          type OperationsState = {
              scheduler: {
                  state: OperationalState;
                  observed_at: string | null;
              };
              queue: {
                  state: OperationalState;
                  completed_at: string | null;
              };
              instructions: {
                  scheduler: string;
                  worker: string;
              };
              blocking: boolean;
          };
          """
          if type_anchor not in source:
              raise SystemExit('migration type anchor missing')
          source = source.replace(type_anchor, type_replacement, 1)

          export_anchor = '\nexport default function Installer({'
          if export_anchor not in source:
              raise SystemExit('export anchor missing')

          operations_card = r'''
function OperationsCard({
    operations,
    canDispatchProbe,
    canContinue,
}: {
    operations: OperationsState;
    canDispatchProbe: boolean;
    canContinue: boolean;
}) {
    const [isRefreshing, setIsRefreshing] = useState(false);
    const hasWarnings =
        operations.scheduler.state === 'warning' ||
        operations.queue.state === 'warning';

    const status = (state: OperationalState): HealthStatus =>
        state === 'verified' ? 'pass' : state;
    const statusLabel = (state: OperationalState): string => {
        if (state === 'verified') {
            return 'تأیید شده';
        }

        if (state === 'warning') {
            return 'هنوز مشاهده نشده';
        }

        return 'خطای مسدودکننده';
    };
    const evidenceTime = (value: string | null): string => {
        if (!value) {
            return 'شاهد اجرایی تازه‌ای ثبت نشده است.';
        }

        const parsed = new Date(value);

        return Number.isNaN(parsed.getTime())
            ? value
            : parsed.toLocaleString('fa-IR');
    };

    const refreshOperations = () => {
        if (isRefreshing) {
            return;
        }

        router.reload({
            only: ['installer', 'operations'],
            onStart: () => setIsRefreshing(true),
            onFinish: () => setIsRefreshing(false),
        });
    };

    return (
        <section className="rounded-2xl border bg-card p-5 shadow-sm sm:p-6">
            <div className="flex flex-wrap items-start justify-between gap-4">
                <div className="flex items-start gap-3">
                    <div className="flex size-10 shrink-0 items-center justify-center rounded-xl border bg-muted/30">
                        <ServerCog className="size-5" />
                    </div>
                    <div>
                        <h2 className="font-semibold">
                            مرحله ۶ — اجرای زمان‌بندی و صف
                        </h2>
                        <p className="mt-1 max-w-2xl text-sm leading-6 text-muted-foreground">
                            آماده بودن این مرحله از روی اجرای واقعی روی همین سرور
                            سنجیده می‌شود، نه فقط از روی تنظیمات. فرمان‌های زیر را
                            در Cron Jobs کنترل‌پنل هاست ثبت کنید و سپس شاهد اجرا را
                            دوباره بررسی کنید.
                        </p>
                    </div>
                </div>
                <button
                    type="button"
                    onClick={refreshOperations}
                    disabled={isRefreshing}
                    className="inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-lg border bg-background px-4 text-sm font-semibold shadow-sm transition hover:bg-muted disabled:cursor-not-allowed disabled:opacity-45"
                >
                    {isRefreshing ? (
                        <LoaderCircle className="size-4 animate-spin" />
                    ) : (
                        <RefreshCw className="size-4" />
                    )}
                    بررسی دوباره
                </button>
            </div>

            <div className="mt-5 grid gap-3 md:grid-cols-2">
                <article className="rounded-xl border bg-background p-4">
                    <div className="flex items-start gap-3">
                        <StatusIcon status={status(operations.scheduler.state)} />
                        <div className="min-w-0">
                            <div className="flex flex-wrap items-center gap-2">
                                <h3 className="text-sm font-semibold">
                                    Scheduler / Cron
                                </h3>
                                <span className="rounded-full border px-2 py-0.5 text-[10px] font-medium text-muted-foreground">
                                    {statusLabel(operations.scheduler.state)}
                                </span>
                            </div>
                            <p className="mt-1 text-xs leading-6 text-muted-foreground">
                                {evidenceTime(
                                    operations.scheduler.observed_at,
                                )}
                            </p>
                        </div>
                    </div>
                </article>

                <article className="rounded-xl border bg-background p-4">
                    <div className="flex items-start gap-3">
                        <StatusIcon status={status(operations.queue.state)} />
                        <div className="min-w-0">
                            <div className="flex flex-wrap items-center gap-2">
                                <h3 className="text-sm font-semibold">
                                    Queue Worker
                                </h3>
                                <span className="rounded-full border px-2 py-0.5 text-[10px] font-medium text-muted-foreground">
                                    {statusLabel(operations.queue.state)}
                                </span>
                            </div>
                            <p className="mt-1 text-xs leading-6 text-muted-foreground">
                                {evidenceTime(operations.queue.completed_at)}
                            </p>
                        </div>
                    </div>
                </article>
            </div>

            <div className="mt-5 grid gap-4">
                <div className="rounded-xl border bg-muted/20 p-4">
                    <p className="text-xs font-semibold text-muted-foreground">
                        Cron زمان‌بندی — هر دقیقه
                    </p>
                    <code
                        className="mt-3 block overflow-x-auto rounded-lg border bg-background p-3 text-left text-xs leading-6"
                        dir="ltr"
                    >
                        {operations.instructions.scheduler}
                    </code>
                </div>
                <div className="rounded-xl border bg-muted/20 p-4">
                    <p className="text-xs font-semibold text-muted-foreground">
                        Cron پردازش صف — هر دقیقه
                    </p>
                    <code
                        className="mt-3 block overflow-x-auto rounded-lg border bg-background p-3 text-left text-xs leading-6"
                        dir="ltr"
                    >
                        {operations.instructions.worker}
                    </code>
                </div>
            </div>

            {operations.blocking ? (
                <div className="mt-5 flex gap-3 rounded-xl border border-destructive/30 bg-destructive/10 p-4 text-sm leading-6 text-destructive">
                    <CircleX className="mt-0.5 size-5 shrink-0" />
                    ذخیره‌سازی شاهد اجرای Scheduler یا Queue با خطای
                    مسدودکننده روبه‌رو است. تا رفع این خطا نصب نهایی نمی‌شود.
                </div>
            ) : hasWarnings ? (
                <div className="mt-5 flex gap-3 rounded-xl border border-amber-500/30 bg-amber-500/10 p-4 text-sm leading-6 text-amber-800 dark:text-amber-300">
                    <AlertTriangle className="mt-0.5 size-5 shrink-0" />
                    هنوز اجرای واقعی هر دو بخش تأیید نشده است. بعد از ثبت Cronها
                    می‌توانید Queue Probe بفرستید و «بررسی دوباره» را بزنید. اگر
                    کنترل‌پنل اجرا را با تأخیر انجام می‌دهد، ادامه فقط با پذیرش
                    صریح این هشدار ممکن است.
                </div>
            ) : (
                <div className="mt-5 flex gap-3 rounded-xl border border-emerald-500/30 bg-emerald-500/10 p-4 text-sm leading-6 text-emerald-800 dark:text-emerald-300">
                    <CheckCircle2 className="mt-0.5 size-5 shrink-0" />
                    هم Scheduler و هم Queue با شاهد اجرای تازه تأیید شده‌اند.
                </div>
            )}

            <div className="mt-5 grid gap-4 lg:grid-cols-2">
                <Form
                    action="/install/operations/probe"
                    method="post"
                    disableWhileProcessing
                >
                    {({ processing, errors }) => (
                        <div className="space-y-3 rounded-xl border p-4">
                            <div>
                                <h3 className="text-sm font-semibold">
                                    تست واقعی Queue
                                </h3>
                                <p className="mt-1 text-xs leading-6 text-muted-foreground">
                                    یک job سبک در صف database قرار می‌گیرد. فقط
                                    وقتی worker واقعاً آن را اجرا کند وضعیت Queue
                                    تأیید می‌شود.
                                </p>
                            </div>
                            <InputError message={errors.operations} />
                            <Button
                                type="submit"
                                disabled={
                                    !canDispatchProbe ||
                                    processing ||
                                    operations.blocking
                                }
                            >
                                {processing ? <Spinner /> : <Database className="size-4" />}
                                ارسال Queue Probe
                            </Button>
                        </div>
                    )}
                </Form>

                <Form
                    action="/install/operations/continue"
                    method="post"
                    disableWhileProcessing
                >
                    {({ processing, errors }) => (
                        <div className="space-y-3 rounded-xl border p-4">
                            <div>
                                <h3 className="text-sm font-semibold">
                                    عبور به نهایی‌سازی
                                </h3>
                                <p className="mt-1 text-xs leading-6 text-muted-foreground">
                                    حالت تأییدشده بدون پذیرش هشدار ادامه پیدا
                                    می‌کند. هشدارهای مشاهده‌نشده فقط با تأیید
                                    صریح شما در journal ثبت می‌شوند.
                                </p>
                            </div>
                            <InputError message={errors.operations} />
                            <input
                                type="hidden"
                                name="acknowledge_warnings"
                                value="0"
                            />
                            {hasWarnings ? (
                                <label className="flex items-start gap-3 rounded-lg bg-muted/30 p-3 text-xs leading-6">
                                    <input
                                        type="checkbox"
                                        name="acknowledge_warnings"
                                        value="1"
                                        required
                                        className="mt-1 size-4 rounded border-input"
                                    />
                                    <span>
                                        Cronهای نمایش‌داده‌شده را در کنترل‌پنل
                                        تنظیم کرده‌ام و می‌پذیرم که هنوز شاهد
                                        اجرای تازه ثبت نشده است.
                                    </span>
                                </label>
                            ) : null}
                            <Button
                                type="submit"
                                disabled={
                                    !canContinue ||
                                    processing ||
                                    operations.blocking
                                }
                            >
                                {processing ? (
                                    <Spinner />
                                ) : (
                                    <CheckCircle2 className="size-4" />
                                )}
                                {hasWarnings
                                    ? 'پذیرش هشدار و ادامه'
                                    : 'ادامه به نهایی‌سازی'}
                            </Button>
                        </div>
                    )}
                </Form>
            </div>
        </section>
    );
}
'''
          source = source.replace(export_anchor, '\n' + operations_card + export_anchor, 1)

          props_anchor = """export default function Installer({
              installer,
              preflight,
              migrations,
          }: {
              installer: InstallerState;
              preflight: HealthReport;
              migrations: MigrationState | null;
          }) {
          """
          props_replacement = """export default function Installer({
              installer,
              preflight,
              migrations,
              operations,
          }: {
              installer: InstallerState;
              preflight: HealthReport;
              migrations: MigrationState | null;
              operations: OperationsState | null;
          }) {
          """
          if props_anchor not in source:
              raise SystemExit('props anchor missing')
          source = source.replace(props_anchor, props_replacement, 1)

          actions_anchor = """    const canRunMigrations = installer.actions.includes('run_migrations');
              const canCreateOwner = installer.actions.includes('create_owner');
          """
          actions_replacement = actions_anchor + """    const canDispatchQueueProbe = installer.actions.includes(
              'dispatch_queue_probe',
          );
              const canContinueOperations = installer.actions.includes(
                  'continue_operations',
              );
          """
          if actions_anchor not in source:
              raise SystemExit('actions anchor missing')
          source = source.replace(actions_anchor, actions_replacement, 1)

          placeholder_anchor = """                    {['operations', 'finalize'].includes(installer.phase) ? (
                                  <section className=\"rounded-2xl border border-dashed bg-card/50 p-5 sm:p-6\">
                                      <h2 className=\"font-semibold\">
                                          مرحله فعلی با موفقیت باز شده است
                                      </h2>
                                      <p className=\"mt-1 text-sm leading-6 text-muted-foreground\">
                                          این مرحله فقط بعد از تکمیل قرارداد backend خودش
                                          فعال می‌شود؛ تا آن زمان هیچ دکمه‌ی عبور ساختگی
                                          نمایش داده نمی‌شود.
                                      </p>
                                  </section>
                              ) : null}
          """
          placeholder_replacement = """                    {installer.phase === 'operations' && operations ? (
                                  <OperationsCard
                                      operations={operations}
                                      canDispatchProbe={canDispatchQueueProbe}
                                      canContinue={canContinueOperations}
                                  />
                              ) : null}

                              {installer.phase === 'finalize' ? (
                                  <section className=\"rounded-2xl border border-dashed bg-card/50 p-5 sm:p-6\">
                                      <h2 className=\"font-semibold\">
                                          مرحله نهایی‌سازی آماده‌ی پیاده‌سازی است
                                      </h2>
                                      <p className=\"mt-1 text-sm leading-6 text-muted-foreground\">
                                          این مرحله فقط بعد از تکمیل قرارداد نهایی‌سازی فعال می‌شود؛ تا آن زمان هیچ دکمه‌ی عبور ساختگی نمایش داده نمی‌شود.
                                      </p>
                                  </section>
                              ) : null}
          """
          if placeholder_anchor not in source:
              raise SystemExit('placeholder anchor missing')
          source = source.replace(placeholder_anchor, placeholder_replacement, 1)

          path.write_text(source)
          PY
          npx vp check --fix resources/js/pages/install/index.tsx
          git rm .github/workflows/installer-operations-ui-once.yml
          git add resources/js/pages/install/index.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add installer operational activation UI'
          git push origin HEAD:feature/self-host-installer

name: Installer owner UI once

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-owner-ui-once.yml

permissions:
  contents: write

jobs:
  patch-and-cleanup:
    runs-on: ubuntu-24.04
    env:
      OWNER_CARD_B64: 
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Apply owner UI and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('resources/js/pages/install/index.tsx')
          source = path.read_text()
          owner_card = base64.b64decode(os.environ['OWNER_CARD_B64']).decode()
          export_anchor = '\nexport default function Installer({'
          if export_anchor not in source:
              raise SystemExit('export anchor missing')
          source = source.replace(export_anchor, '\n' + owner_card + export_anchor, 1)
          action_anchor = "    const canRunMigrations = installer.actions.includes('run_migrations');\n"
          if action_anchor not in source:
              raise SystemExit('action anchor missing')
          source = source.replace(action_anchor, action_anchor + "    const canCreateOwner = installer.actions.includes('create_owner');\n", 1)
          old = "                    {['owner', 'operations', 'finalize'].includes(\n"
          new = "                    {installer.phase === 'owner' ? (\n                        <OwnerCard canCreate={canCreateOwner} />\n                    ) : null}\n\n                    {['operations', 'finalize'].includes(\n"
          if old not in source:
              raise SystemExit('render anchor missing')
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          npx vp check --fix resources/js/pages/install/index.tsx
          git rm .github/workflows/installer-owner-ui-once.yml
          git add resources/js/pages/install/index.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add installer owner bootstrap UI'
          git push origin HEAD:feature/self-host-installer

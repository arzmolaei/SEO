name: Installer owner UI once

on:
  push:
    branches:
      - feature/self-host-installer
    paths:
      - .github/workflows/installer-owner-ui-once.yml

permissions:
  contents: write

jobs:
  patch-and-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Apply owner UI and remove temporary workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('resources/js/pages/install/index.tsx')
          source = path.read_text()

          owner_card = r'''
function OwnerCard({ canCreate }: { canCreate: boolean }) {
    return (
        <section className="rounded-2xl border bg-card p-5 shadow-sm sm:p-6">
            <div className="flex items-start gap-3">
                <div className="flex size-10 shrink-0 items-center justify-center rounded-xl border bg-muted/30">
                    <KeyRound className="size-5" />
                </div>
                <div>
                    <h2 className="font-semibold">مرحله ۵ — مالک اولیه</h2>
                    <p className="mt-1 max-w-2xl text-sm leading-6 text-muted-foreground">
                        اولین مالک و فضای کاری اصلی فقط یک‌بار ساخته می‌شوند. این حساب برای نصب محلی تأییدشده محسوب می‌شود تا راه‌اندازی به ایمیل یا اینترنت خارجی وابسته نباشد.
                    </p>
                </div>
            </div>

            <Form
                action="/install/owner"
                method="post"
                resetOnSuccess={['password', 'password_confirmation']}
                disableWhileProcessing
                className="mt-6 grid gap-5"
            >
                {({ processing, errors }) => (
                    <>
                        <InputError message={errors.owner} />

                        <div className="grid gap-4 md:grid-cols-2">
                            <div className="grid gap-2">
                                <Label htmlFor="owner_name">نام مالک</Label>
                                <Input
                                    id="owner_name"
                                    name="name"
                                    required
                                    maxLength={255}
                                    autoComplete="name"
                                    placeholder="نام و نام خانوادگی"
                                />
                                <InputError message={errors.name} />
                            </div>

                            <div className="grid gap-2">
                                <Label htmlFor="owner_email">ایمیل مالک</Label>
                                <Input
                                    id="owner_email"
                                    name="email"
                                    type="email"
                                    dir="ltr"
                                    required
                                    maxLength={255}
                                    autoComplete="email"
                                    placeholder="owner@example.com"
                                />
                                <InputError message={errors.email} />
                            </div>
                        </div>

                        <div className="grid gap-2">
                            <Label htmlFor="workspace_name">نام فضای کاری</Label>
                            <Input
                                id="workspace_name"
                                name="workspace_name"
                                required
                                maxLength={255}
                                defaultValue="فضای کاری اصلی"
                                autoComplete="organization"
                            />
                            <InputError message={errors.workspace_name} />
                        </div>

                        <div className="grid gap-4 md:grid-cols-2">
                            <div className="grid gap-2">
                                <Label htmlFor="owner_password">رمز عبور</Label>
                                <PasswordInput
                                    id="owner_password"
                                    name="password"
                                    dir="ltr"
                                    required
                                    autoComplete="new-password"
                                />
                                <InputError message={errors.password} />
                            </div>

                            <div className="grid gap-2">
                                <Label htmlFor="owner_password_confirmation">
                                    تکرار رمز عبور
                                </Label>
                                <PasswordInput
                                    id="owner_password_confirmation"
                                    name="password_confirmation"
                                    dir="ltr"
                                    required
                                    autoComplete="new-password"
                                />
                                <InputError message={errors.password_confirmation} />
                            </div>
                        </div>

                        <p className="rounded-xl border bg-muted/20 p-4 text-xs leading-6 text-muted-foreground">
                            رمز باید حداقل ۱۲ نویسه و شامل حروف کوچک و بزرگ، عدد و نماد باشد. این بررسی کاملاً محلی است و برای نصب به سرویس خارجی متصل نمی‌شود.
                        </p>

                        <Button
                            type="submit"
                            disabled={!canCreate || processing}
                            className="w-full sm:w-fit"
                        >
                            {processing ? <Spinner /> : <KeyRound className="size-4" />}
                            ساخت مالک و فضای کاری
                        </Button>
                    </>
                )}
            </Form>
        </section>
    );
}
'''

          export_anchor = '\nexport default function Installer({'
          if export_anchor not in source:
              raise SystemExit('export anchor missing')
          source = source.replace(export_anchor, '\n' + owner_card + export_anchor, 1)

          action_anchor = "    const canRunMigrations = installer.actions.includes('run_migrations');\n"
          if action_anchor not in source:
              raise SystemExit('action anchor missing')
          source = source.replace(
              action_anchor,
              action_anchor + "    const canCreateOwner = installer.actions.includes('create_owner');\n",
              1,
          )

          render_anchor = """                    {installer.phase === 'migrations' && migrations ? (\n                        <MigrationCard\n                            migrations={migrations}\n                            canRun={canRunMigrations}\n                        />\n                    ) : null}\n\n                    {['owner', 'operations', 'finalize'].includes(\n"""
          render_replacement = """                    {installer.phase === 'migrations' && migrations ? (\n                        <MigrationCard\n                            migrations={migrations}\n                            canRun={canRunMigrations}\n                        />\n                    ) : null}\n\n                    {installer.phase === 'owner' ? (\n                        <OwnerCard canCreate={canCreateOwner} />\n                    ) : null}\n\n                    {['operations', 'finalize'].includes(\n"""
          if render_anchor not in source:
              raise SystemExit('render anchor missing')
          source = source.replace(render_anchor, render_replacement, 1)

          path.write_text(source)
          PY
          npx vp check --fix resources/js/pages/install/index.tsx
          git rm .github/workflows/installer-owner-ui-once.yml
          git add resources/js/pages/install/index.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add installer owner bootstrap UI'
          git push origin HEAD:feature/self-host-installer

name: Pint Persian Export Once

on:
  push:
    branches:
      - feature/persian-export

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/persian-export
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Format exact files and self-delete
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pint app/Services/Exports/ProjectSeoExportSnapshot.php tests/Feature/Exports/ProjectSeoExportSnapshotTest.php
          git rm .github/workflows/pint-persian-export-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Services/Exports/ProjectSeoExportSnapshot.php tests/Feature/Exports/ProjectSeoExportSnapshotTest.php
          git commit -m 'style: format project SEO export snapshot'
          git push origin HEAD:feature/persian-export

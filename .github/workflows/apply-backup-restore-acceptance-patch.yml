name: Apply backup restore acceptance patch

on:
  push:
    branches:
      - feature/backup-restore
    paths:
      - .github/workflows/apply-backup-restore-acceptance-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/backup-restore

      - name: Apply minimal test-only patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/Feature/Acceptance/BackupRestoreMariaDbAcceptanceTest.php')
          text = path.read_text()
          replacements = {
              "use App\\Services\\Backup\\RecoverInterruptedRestore;\n": "use App\\Services\\Backup\\RecoverInterruptedRestore;\nuse App\\Services\\Backup\\RestorePreview;\n",
              "use App\\Services\\Keywords\\CreateKeywordCluster;\n": "use App\\Services\\Keywords\\CreateKeywordCluster;\nuse App\\Services\\Keywords\\MapClusterToTarget;\n",
              "app(\\App\\Services\\Keywords\\MapClusterToTarget::class)": "app(MapClusterToTarget::class)",
              "private function verifyBundle(string $bundlePath): \\App\\Services\\Backup\\RestorePreview": "private function verifyBundle(string $bundlePath): RestorePreview",
              "$this->assertSame('mysql', DB::connection()->getDriverName());": "$this->assertSame('mariadb', DB::connection()->getDriverName());",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected patch target not found: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify PHP style for patched acceptance test
        run: vendor/bin/pint --test tests/Feature/Acceptance/BackupRestoreMariaDbAcceptanceTest.php

      - name: Commit exact patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-backup-restore-acceptance-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Feature/Acceptance/BackupRestoreMariaDbAcceptanceTest.php .github/workflows/apply-backup-restore-acceptance-patch.yml
          git commit -m "test: fix MariaDB acceptance fixture assumptions"
          git push origin HEAD:feature/backup-restore
